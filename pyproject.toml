[project]
name = "open-fuel-api"
version = "0.2.0"
description = "Open, read-only South African fuel price API on Cloudflare Workers and D1"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.12,<1",
    "workers-py>=1.16.1,<2",
]

[tool.uv]
default-groups = ["dev"]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["test_api.py", "tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
